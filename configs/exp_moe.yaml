# Эксперимент: Mixtral — MoE 8 экспертов, top-2, aux loss (нужно больше VRAM).
# Запуск: python scripts/07_train.py --config configs/exp_moe.yaml --batch-size 8 --grad-accum 6

model:
  arch: mixtral
  n_layer: 6
  n_embd: 384
  n_head: 6
  seq_len: 512
  vocab_size: 32772
  n_experts: 8
  n_experts_per_tok: 2
  moe_aux_loss_coef: 0.01
  tie_word_embeddings: true
  dropout: 0.0

train:
  data_dir: data/bins
  tokenizer: tokenizer/final
  outdir: checkpoints/exp_moe
  log_dir: logs/exp_moe
  batch_size: 8
  grad_accum: 6
  grad_clip: 1.0
  lr: 6e-4
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 8000
  eval_every: 500
  save_every: 1000
  gen_every: 1000
  save_total_limit: 2
  seed: 42
  amp: bf16
  grad_checkpointing: true
  num_workers: 0