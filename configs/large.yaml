model:
  arch: mistral
  n_layer: 16         
  n_embd: 640        
  n_head: 10          
  seq_len: 1024
  vocab_size: 16384
  tie_word_embeddings: true
  dropout: 0.0

train:
  data_dir: data/bins
  tokenizer: tokenizer/final
  outdir: checkpoints/large
  log_dir: logs/large
  batch_size: 4           
  grad_accum: 8           
  grad_clip: 1.0
  lr: 5e-5                
  warmup_steps: 2000     
  weight_decay: 0.1
  max_steps: 150000       
  eval_every: 500
  save_every: 1000
  gen_every: 1000
  save_total_limit: 2
  seed: 42
  amp: bf16
  grad_checkpointing: true
  num_workers: 0