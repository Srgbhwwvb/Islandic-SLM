# Эксперимент: GPT-2 (learned positions, GELU MLP) вместо Mistral (RoPE+SwiGLU).
# Запуск: python scripts/07_train.py --config configs/exp_gpt2.yaml

model:
  arch: gpt2
  n_layer: 6
  n_embd: 384
  n_head: 6
  seq_len: 512
  vocab_size: 32772
  tie_word_embeddings: true
  dropout: 0.0

train:
  data_dir: data/bins
  tokenizer: tokenizer/final
  outdir: checkpoints/exp_gpt2
  log_dir: logs/exp_gpt2
  batch_size: 16
  grad_accum: 4
  grad_clip: 1.0
  lr: 6e-4
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 8000
  eval_every: 500
  save_every: 1000
  gen_every: 1000
  save_total_limit: 2
  seed: 42
  amp: bf16
  grad_checkpointing: false
  num_workers: 0